<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>404 · ZAPI | Esta planta aún no brotó</title>

<!-- ==========================================================
     TIPOGRAFÍAS (único recurso externo permitido)
     Las mismas del sitio: Bebas Neue para titulares y números,
     Inter para texto y botón. Con fallback local en 404.css.
     ========================================================== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:opsz,wght@14..32,100..900&display=swap"
    rel="stylesheet">

<link rel="stylesheet" href="./public/css/404.css">
</head>

<body>
<main class="escena">

    <!-- Marca -->
    <p class="marca">ZAPI</p>

    <!-- El error 404. El h1 lleva el nombre accesible; los dígitos
         y el SVG son decorativos (aria-hidden). -->
    <h1 class="year go" id="planta404" aria-label="Error 404">
        <span class="digit" aria-hidden="true">4</span>

        <!-- El "0" es un tazón del que crece una planta -->
        <svg class="tazon-svg" viewBox="0 0 200 260" aria-hidden="true" focusable="false">
            <!-- Tazón con tierra -->
            <g class="tazon">
                <path class="tazon-cuerpo"
                      d="M44 176 L156 176 L140 246 c-2 8 -9 12 -17 12 H77 c-8 0 -15 -4 -17 -12 Z"/>
                <ellipse class="tazon-borde" cx="100" cy="176" rx="58" ry="13"/>
                <ellipse class="tierra"      cx="100" cy="177" rx="48" ry="10"/>
                <ellipse class="tierra-luz"  cx="86"  cy="174" rx="16" ry="4"/>
            </g>

            <!-- Planta: tallo, hojas y brote; se mece desde la base -->
            <g class="planta">
                <path class="tallo" pathLength="1"
                      d="M100 178 C 93 146, 107 112, 100 82 C 95 58, 104 50, 100 42"/>

                <!-- Hojas: dos tonos (salvia/oliva), alternando lado,
                     cada una más chica hacia la punta -->
                <g transform="translate(100,146) rotate(-34)">
                    <g class="hoja hoja--salvia l1">
                        <path class="hoja-cuerpo" d="M0 0 C 12 -13, 35 -13, 46 0 C 35 13, 12 13, 0 0 Z"/>
                        <path class="hoja-vena"   d="M4 0 C 16 -1.6, 30 -1.6, 42 0"/>
                    </g>
                </g>
                <g transform="translate(100,124) rotate(212) scale(.95)">
                    <g class="hoja hoja--oliva l2">
                        <path class="hoja-cuerpo" d="M0 0 C 12 -13, 35 -13, 46 0 C 35 13, 12 13, 0 0 Z"/>
                        <path class="hoja-vena"   d="M4 0 C 16 -1.6, 30 -1.6, 42 0"/>
                    </g>
                </g>
                <g transform="translate(100,102) rotate(-42) scale(.95)">
                    <g class="hoja hoja--oliva l3">
                        <path class="hoja-cuerpo" d="M0 0 C 12 -13, 35 -13, 46 0 C 35 13, 12 13, 0 0 Z"/>
                        <path class="hoja-vena"   d="M4 0 C 16 -1.6, 30 -1.6, 42 0"/>
                    </g>
                </g>
                <g transform="translate(100,82) rotate(206) scale(.9)">
                    <g class="hoja hoja--salvia l4">
                        <path class="hoja-cuerpo" d="M0 0 C 12 -13, 35 -13, 46 0 C 35 13, 12 13, 0 0 Z"/>
                        <path class="hoja-vena"   d="M4 0 C 16 -1.6, 30 -1.6, 42 0"/>
                    </g>
                </g>
                <g transform="translate(100,64) rotate(-30) scale(.85)">
                    <g class="hoja hoja--salvia l5">
                        <path class="hoja-cuerpo" d="M0 0 C 12 -13, 35 -13, 46 0 C 35 13, 12 13, 0 0 Z"/>
                        <path class="hoja-vena"   d="M4 0 C 16 -1.6, 30 -1.6, 42 0"/>
                    </g>
                </g>
                <g transform="translate(100,50) rotate(218) scale(.8)">
                    <g class="hoja hoja--oliva l6">
                        <path class="hoja-cuerpo" d="M0 0 C 12 -13, 35 -13, 46 0 C 35 13, 12 13, 0 0 Z"/>
                        <path class="hoja-vena"   d="M4 0 C 16 -1.6, 30 -1.6, 42 0"/>
                    </g>
                </g>

                <!-- Brote en la punta -->
                <g transform="translate(100,42)">
                    <g class="brote">
                        <path class="brote-cuerpo" d="M0 0 C -10 -12, -8 -28, 0 -34 C 8 -28, 10 -12, 0 0 Z"/>
                        <path class="brote-linea"  d="M0 -3 L 0 -31"/>
                    </g>
                </g>
            </g>
        </svg>

        <span class="digit" aria-hidden="true">4</span>
    </h1>

    <!-- Mensaje y salida -->
    <h2 class="titulo">Esta planta aún no brotó</h2>
    <p class="texto">
        La página que buscás no existe o cambió de lugar.
        Volvamos a sembrar desde el inicio.
    </p>
    <a class="boton" href="/">Volver al inicio</a>

</main>

<script src="./public/js/404.js"></script>
</body>
</html>
