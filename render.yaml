# Blueprint de Render para la API: https://render.com/docs/blueprint-spec
# El sitio estatico (GitHub Pages) se despliega por separado; este
# servicio mantiene la API Express y Mongo. Render inyecta PORT;
# el resto se setea en el dashboard del servicio (sync: false = el
# blueprint no pisa lo que se configura ahi).
services:
  - type: web
    name: zapi-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: ZAPI_SESSION_SECRET
        sync: false
      - key: ZAPI_ADMIN_TOKEN
        sync: false
      # Origenes permitidos de CORS, separados por coma: la URL de
      # GitHub Pages del sitio (ej. https://usuario.github.io/repo).
      - key: CLIENT_URL
        sync: false