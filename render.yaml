services:
  - type: web
    name: zapi-backend
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: zapi-api2
      - key: FRONTEND_ORIGINS
        value: https://zapivivero.vercel.app
      - key: TRUST_PROXY
        value: "1"
      - key: CRON_SECRET
        sync: false
