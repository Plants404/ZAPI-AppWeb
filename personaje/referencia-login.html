<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ingresar · Pequeños brotes, grandes sueños</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600&display=swap">
<style>

:root{--bg:#EFEBDD;--card:#FBF9F1;--ink:#33402A;--muted:#6B7658;--green:#6E8F4E;--olive:#5E6E2F;--olive-d:#46531F;--line:#D8D3BF;--btn-ink:#FBF9F1;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1C2216;--card:#262E1E;--ink:#ECEAD9;--muted:#A9B596;--green:#8FB36B;--olive:#8FA652;--olive-d:#6F8438;--line:#3A4530;--btn-ink:#1C2216}}
:root[data-theme="dark"]{--bg:#1C2216;--card:#262E1E;--ink:#ECEAD9;--muted:#A9B596;--green:#8FB36B;--olive:#8FA652;--olive-d:#6F8438;--line:#3A4530;--btn-ink:#1C2216}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Montserrat',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px;overflow-x:hidden}
.wrap{width:min(100%,380px);text-align:center}
.head{position:relative;width:clamp(210px,62vw,300px);aspect-ratio:235.30 / 257.40;margin:0 auto 14px;user-select:none;-webkit-user-select:none}
.tilt{position:absolute;inset:0;transform:rotate(var(--r,0deg)) translateX(var(--tx,0%));transition:transform .3s ease-out}
.pp,.bob{position:absolute;inset:0}
.pp.pop{animation:pop .38s ease-out}
.bob{animation:bob 3.4s ease-in-out infinite alternate;transform-origin:50% 92%}
.ex{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .1s;overflow:visible}
.head[data-face="1"] .f1{opacity:1}
.head[data-face="2"] .f2{opacity:1}
.head[data-face="3"] .f3{opacity:1}
.head[data-face="4"] .f4{opacity:1}
.head[data-face="5"] .f5{opacity:1}
.head[data-face="6"] .f6{opacity:1}
.head[data-face="7"] .f7{opacity:1}
.head[data-face="8"] .f8{opacity:1}
.head[data-face="9"] .f9{opacity:1}
.head[data-face="10"] .f10{opacity:1}
.head[data-face="11"] .f11{opacity:1}
.head[data-face="12"] .f12{opacity:1}
.shake{animation:shake .5s}
[data-state=ok] .bob{animation:hop .5s ease-in-out 3}
.card{background:var(--card);border-radius:26px;padding:26px 24px 24px;box-shadow:0 14px 40px rgba(50,60,30,.16);text-align:left}
h1{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:36px;letter-spacing:.05em;margin:0 0 2px;text-align:center;color:var(--olive)}
.msg{margin:0 0 18px;text-align:center;color:var(--muted);font-size:14px;min-height:20px}
label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
.f{margin-bottom:14px;position:relative}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px 14px;outline:none;transition:border-color .2s}
input:focus{border-color:var(--green)}
.eye{position:absolute;right:8px;top:30px;background:none;border:0;color:var(--muted);font:600 12px 'Montserrat',sans-serif;cursor:pointer;padding:8px}
button.go{width:100%;border:0;border-radius:999px;background:var(--olive);color:var(--btn-ink);font:600 16px 'Montserrat',sans-serif;padding:14px;cursor:pointer;transition:background .2s,transform .2s}
button.go:hover,button.go:focus-visible{background:var(--olive-d);transform:translateY(-2px)}
.tag{margin:16px 0 0;text-align:center;font-size:12px;color:var(--muted)}
@keyframes bob{from{transform:translateY(0) rotate(-1.4deg)}to{transform:translateY(-1.2%) rotate(1.4deg)}}
@keyframes pop{0%{transform:scale(.93,1.05)}45%{transform:scale(1.05,.96)}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes hop{50%{transform:translateY(-6%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<div id="shake">
<div class="head" id="hd" data-state="happy" data-face="1" role="img" aria-label="Personaje con un brote en la cabeza">
<div class="tilt" id="tilt"><div class="pp" id="pp"><div class="bob">
<img class="ex f1" src="01-feliz.svg" alt="" draggable="false">
<img class="ex f2" src="02-duda.svg" alt="" draggable="false">
<img class="ex f3" src="03-llanto.svg" alt="" draggable="false">
<img class="ex f4" src="04-lentes.svg" alt="" draggable="false">
<img class="ex f5" src="05-ojos-tapados.svg" alt="" draggable="false">
<img class="ex f6" src="06-diablito.svg" alt="" draggable="false">
<img class="ex f7" src="07-guino.svg" alt="" draggable="false">
<img class="ex f8" src="08-corazon.svg" alt="" draggable="false">
<img class="ex f9" src="09-aburrido.svg" alt="" draggable="false">
<img class="ex f10" src="10-susto.svg" alt="" draggable="false">
<img class="ex f11" src="11-enojo.svg" alt="" draggable="false">
<img class="ex f12" src="12-apenado.svg" alt="" draggable="false">

</div></div></div>
</div>
</div>
<form class="card" id="f" novalidate>
 <h1>Bienvenido</h1>
 <p class="msg" id="msg" aria-live="polite">¡Hola! Ingresá para seguir creciendo</p>
 <div class="f"><label for="u">Correo</label><input id="u" type="email" autocomplete="email" placeholder="tu@correo.com"></div>
 <div class="f"><label for="p">Contraseña</label><input id="p" type="password" autocomplete="current-password" placeholder="••••••••"><button type="button" class="eye" id="t" aria-label="Mostrar contraseña">VER</button></div>
 <button class="go" type="submit">Ingresar</button>
 <p class="tag">Pequeños brotes, grandes sueños</p>
</form>
</div>
<script>
(function(){
var $=function(s){return document.querySelector(s)},hd=$('#hd'),tilt=$('#tilt'),pp=$('#pp'),msg=$('#msg'),u=$('#u'),p=$('#p'),t=$('#t');
var cl=function(v,a,b){return Math.max(a,Math.min(b,v))};
var DEF='¡Hola! Ingresá para seguir creciendo',FACE={happy:1,idle:1,look:1,hide:5,confuse:2,error:3,ok:4},tm,state='happy';
function face(){return state==='hide'&&hd.hasAttribute('data-peek')?7:FACE[state]}
function setFace(n,quiet){
 if(+hd.dataset.face===n)return;hd.dataset.face=n;
 if(quiet)return;pp.classList.remove('pop');void pp.offsetWidth;pp.classList.add('pop');
}
function st(s,m){state=s;hd.dataset.state=s;if(m)msg.textContent=m;setFace(face());
 if(s==='ok')setTimeout(function(){if(state==='ok')setFace(8)},1300)}
function lean(r,x){tilt.style.setProperty('--r',r+'deg');tilt.style.setProperty('--tx',x+'%')}
function valid(v){return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)}
function confuse(){clearTimeout(tm);st('confuse','Revisá el correo: falta el @ o el .com');lean(-4,0);
 tm=setTimeout(function(){if(state!=='confuse')return;lean(0,0);if(document.activeElement===p)st('hide','Shh, no estoy mirando');else st('idle',DEF)},2200)}
document.addEventListener('pointermove',function(e){
 if(state!=='idle')return;
 var r=hd.getBoundingClientRect(),dx=cl((e.clientX-r.left-r.width/2)/(r.width*1.4),-1,1);lean((dx*4).toFixed(2),(dx*2).toFixed(2));
});
function wink(){setTimeout(function(){
 if(state==='idle'||state==='look'){setFace(7,true);setTimeout(function(){if(state==='idle'||state==='look')setFace(1,true)},750)}
 wink()},3200+Math.random()*3200)}
wink();
st('happy');setTimeout(function(){if(state==='happy')st('idle')},1800);
u.addEventListener('focus',function(){clearTimeout(tm);st('look',DEF);lean(-3,-2)});
u.addEventListener('input',function(){lean(cl((u.value.length-10)*.3,-3,4),cl((u.value.length-10)*.3,-2,3))});
u.addEventListener('blur',function(){if(u.value.trim()&&!valid(u.value.trim()))confuse();else if(state==='look'){st('idle');lean(0,0)}});
p.addEventListener('focus',function(){if(state==='confuse')return;st('hide','Shh, no estoy mirando');lean(0,0)});
p.addEventListener('blur',function(e){if(e.relatedTarget===t)return;hd.removeAttribute('data-peek');if(state==='confuse')return;st('idle',DEF)});
t.addEventListener('click',function(){
 var show=p.type==='password';p.type=show?'text':'password';t.textContent=show?'OCULTAR':'VER';p.focus();
 if(show)hd.setAttribute('data-peek','');else hd.removeAttribute('data-peek');setFace(face());
});
$('#f').addEventListener('submit',function(e){
 e.preventDefault();
 // TODO: reemplazar esta validación de demo por la autenticación real
 if(!valid(u.value.trim())){confuse();return}
 if(p.value.length>=4){st('ok','¡Bienvenido! Entrando…')}
 else{st('error','Ups, revisá tus datos e intentá de nuevo');var s=$('#shake');s.classList.remove('shake');void s.offsetWidth;s.classList.add('shake');
  setTimeout(function(){if(state==='error')st('idle',DEF)},2400)}
});
})();
</script>
</body>
</html>
